<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nike Inspector · DTC3 대시보드</title>
<style>
  :root {
    --black: #111111; --white: #FFFFFF;
    --gray-50: #F8F8F8; --gray-100: #EEEEEE;
    --gray-300: #CCCCCC; --gray-500: #888888; --gray-700: #444444;
    --orange: #FF6B00; --red: #E4002B;
    --green: #1A6B3C; --green-light: #E8F5EE;
    --amber: #E67E22; --amber-light: #FEF3E2;
    --red-light: #FDE8EC; --blue: #1A3A6B; --blue-light: #E8EEF8;
    --purple: #6B1A6B; --purple-light: #F5E8F5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--gray-50); color: var(--black); min-height: 100vh; }

  /* ── 로그인 ── */
  #login-screen { position: fixed; inset: 0; background: var(--black); display: flex; align-items: center; justify-content: center; z-index: 9999; }
  .login-box { width: 340px; padding: 48px 36px; background: #1A1A1A; border: 1px solid #333; }
  .login-logo { font-size: 22px; font-weight: 900; color: var(--white); margin-bottom: 4px; letter-spacing: -0.5px; }
  .login-logo span { color: var(--orange); }
  .login-sub { font-size: 10px; color: var(--gray-500); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 32px; }
  .login-input { width: 100%; padding: 13px 14px; background: #2A2A2A; border: 1px solid #444; color: var(--white); font-size: 15px; letter-spacing: 3px; outline: none; transition: border-color .2s; font-family: monospace; }
  .login-input:focus { border-color: var(--orange); }
  .login-input::placeholder { letter-spacing: 1px; color: #555; font-size: 12px; font-family: sans-serif; }
  .login-btn { width: 100%; margin-top: 10px; padding: 13px; background: var(--orange); border: none; color: var(--white); font-size: 12px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; }
  .login-btn:hover { background: #E05A00; }
  .login-error { margin-top: 8px; font-size: 11px; color: var(--red); display: none; text-align: center; }

  /* ── 헤더 ── */
  #dashboard { display: none; }
  header { background: var(--black); padding: 0 28px; display: flex; align-items: center; justify-content: space-between; height: 52px; position: sticky; top: 0; z-index: 100; }
  .header-logo { font-size: 14px; font-weight: 900; color: var(--white); letter-spacing: -0.5px; }
  .header-logo span { color: var(--orange); }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-time { font-size: 11px; color: var(--gray-500); }
  .auto-badge { font-size: 10px; color: #4CAF50; font-weight: 700; letter-spacing: 1px; }
  .btn-refresh { padding: 5px 12px; background: #222; border: 1px solid #444; color: var(--white); font-size: 11px; font-weight: 700; cursor: pointer; transition: all .2s; }
  .btn-refresh:hover { background: var(--orange); border-color: var(--orange); }

  /* ── 새 데이터 배너 ── */
  #new-data-banner { display: none; background: var(--green); color: var(--white); text-align: center; padding: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
  #new-data-banner:hover { background: #155a32; }

  /* ── 이슈 배너 ── */
  #issue-banner { display: none; background: var(--red); color: var(--white); padding: 10px 28px; font-size: 12px; font-weight: 700; }

  /* ── 필터 바 ── */
  .filter-bar { background: var(--white); border-bottom: 1px solid var(--gray-100); padding: 0 28px; display: flex; align-items: center; gap: 8px; height: 46px; overflow-x: auto; }
  .filter-label { font-size: 10px; font-weight: 700; color: var(--gray-500); letter-spacing: 1px; white-space: nowrap; margin-right: 4px; }
  .chip { padding: 4px 12px; border: 1.5px solid var(--gray-300); background: var(--white); font-size: 11px; font-weight: 600; cursor: pointer; transition: all .15s; border-radius: 20px; color: var(--gray-700); white-space: nowrap; }
  .chip.active { background: var(--black); border-color: var(--black); color: var(--white); }
  .chip.active.orange { background: var(--orange); border-color: var(--orange); }

  /* ── 메인 ── */
  main { padding: 24px 28px; max-width: 1440px; margin: 0 auto; }

  /* ── 섹션 타이틀 ── */
  .section-title { font-size: 10px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--gray-500); margin-bottom: 12px; margin-top: 28px; display: flex; align-items: center; gap: 8px; }
  .section-title:first-child { margin-top: 0; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--gray-100); }

  /* ── 요약 카드 ── */
  .summary-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .sum-card { background: var(--white); border: 1px solid var(--gray-100); padding: 16px 20px; position: relative; overflow: hidden; }
  .sum-card::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--gray-300); }
  .sum-card.orange::before { background: var(--orange); }
  .sum-card.green::before { background: var(--green); }
  .sum-card.red::before { background: var(--red); }
  .sum-card.blue::before { background: var(--blue); }
  .sum-card.amber::before { background: var(--amber); }
  .sum-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--gray-500); margin-bottom: 6px; }
  .sum-value { font-size: 28px; font-weight: 900; letter-spacing: -1px; line-height: 1; }
  .sum-card.orange .sum-value { color: var(--orange); }
  .sum-card.green .sum-value { color: var(--green); }
  .sum-card.red .sum-value { color: var(--red); }
  .sum-card.blue .sum-value { color: var(--blue); }
  .sum-card.amber .sum-value { color: var(--amber); }
  .sum-delta { font-size: 11px; margin-top: 4px; font-weight: 600; }
  .sum-delta.up { color: var(--green); }
  .sum-delta.down { color: var(--red); }
  .sum-delta.neutral { color: var(--gray-500); }
  .sum-sub { font-size: 10px; color: var(--gray-500); margin-top: 2px; }

  /* ── 카드 그리드 ── */
  .cards { display: grid; gap: 10px; }
  .cards-4 { grid-template-columns: repeat(4, 1fr); }
  .cards-3 { grid-template-columns: repeat(3, 1fr); }
  .cards-2 { grid-template-columns: repeat(2, 1fr); }
  .card { background: var(--white); padding: 18px 20px; border: 1px solid var(--gray-100); }
  .card-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--gray-500); margin-bottom: 6px; }
  .card-value { font-size: 28px; font-weight: 900; letter-spacing: -1px; }
  .card.orange .card-value { color: var(--orange); }
  .card.green .card-value { color: var(--green); }
  .card.red .card-value { color: var(--red); }
  .card.blue .card-value { color: var(--blue); }
  .card.amber .card-value { color: var(--amber); }

  /* ── 테이블 ── */
  .table-wrap { background: var(--white); border: 1px solid var(--gray-100); overflow: hidden; }
  .table-header { padding: 12px 18px; border-bottom: 1px solid var(--gray-100); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .table-title { font-size: 12px; font-weight: 800; }
  .table-count { font-size: 11px; color: var(--gray-500); }
  .search-input { padding: 6px 10px; border: 1px solid var(--gray-300); font-size: 11px; outline: none; width: 180px; transition: border-color .2s; }
  .search-input:focus { border-color: var(--black); }
  .filter-row { display: flex; gap: 6px; padding: 8px 18px; border-bottom: 1px solid var(--gray-100); flex-wrap: wrap; align-items: center; background: var(--gray-50); }
  .filter-select { padding: 4px 8px; border: 1.5px solid var(--gray-300); font-size: 11px; font-weight: 600; background: var(--white); cursor: pointer; outline: none; color: var(--gray-700); }
  .filter-select:focus { border-color: var(--black); }
  .btn-reset-filter { padding: 4px 10px; border: 1.5px solid var(--gray-300); background: var(--white); font-size: 11px; font-weight: 700; cursor: pointer; color: var(--gray-500); }
  .btn-reset-filter:hover { border-color: var(--red); color: var(--red); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { padding: 9px 12px; text-align: left; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--gray-500); background: var(--gray-50); border-bottom: 1px solid var(--gray-100); white-space: nowrap; }
  td { padding: 9px 12px; border-bottom: 1px solid var(--gray-100); vertical-align: middle; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #FAFAFA; cursor: pointer; }

  /* ── 뱃지 ── */
  .badge { display: inline-block; padding: 2px 7px; font-size: 10px; font-weight: 700; border-radius: 3px; }
  .badge-green { background: var(--green-light); color: var(--green); }
  .badge-amber { background: var(--amber-light); color: var(--amber); }
  .badge-red { background: var(--red-light); color: var(--red); }
  .badge-blue { background: var(--blue-light); color: var(--blue); }
  .badge-purple { background: var(--purple-light); color: var(--purple); }
  .badge-gray { background: var(--gray-100); color: var(--gray-500); }
  .badge-orange { background: #FFF0E6; color: var(--orange); }

  /* ── 사용자 현황 ── */
  .user-stat-row { display: flex; align-items: center; padding: 10px 18px; border-bottom: 1px solid var(--gray-100); gap: 10px; }
  .user-stat-row:last-child { border-bottom: none; }
  .user-avatar { width: 30px; height: 30px; background: var(--black); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: var(--white); flex-shrink: 0; }
  .user-stat-name { font-size: 12px; font-weight: 700; flex: 1; }
  .user-stat-bar-wrap { flex: 2; height: 5px; background: var(--gray-100); border-radius: 3px; overflow: hidden; }
  .user-stat-bar { height: 100%; background: var(--orange); border-radius: 3px; transition: width .6s ease; }
  .user-stat-num { font-size: 13px; font-weight: 800; min-width: 36px; text-align: right; }

  /* ── 차트 ── */
  .chart-bar-wrap { display: flex; align-items: flex-end; gap: 6px; height: 100px; }
  .chart-col { display: flex; flex-direction: column; align-items: center; flex: 1; gap: 3px; height: 100%; justify-content: flex-end; }
  .chart-val { font-size: 10px; font-weight: 700; color: var(--gray-500); }
  .chart-bar { width: 100%; background: var(--orange); border-radius: 2px 2px 0 0; transition: height .4s ease; min-height: 2px; }
  .chart-label { font-size: 9px; color: var(--gray-500); white-space: nowrap; margin-top: 4px; }

  /* ── 도넛 차트 ── */
  .donut-wrap { display: flex; align-items: center; gap: 20px; padding: 16px 18px; }
  .donut-legend { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* ── 페이지네이션 ── */
  .pagination { display: flex; align-items: center; justify-content: center; gap: 3px; padding: 12px 18px; border-top: 1px solid var(--gray-100); }
  .page-btn { width: 28px; height: 28px; border: 1.5px solid var(--gray-300); background: var(--white); font-size: 11px; font-weight: 600; cursor: pointer; transition: all .15s; color: var(--gray-700); display: flex; align-items: center; justify-content: center; }
  .page-btn:hover:not(.active):not(:disabled) { border-color: var(--black); }
  .page-btn.active { background: var(--black); border-color: var(--black); color: var(--white); }
  .page-btn:disabled { opacity: .3; cursor: default; }
  .page-info { font-size: 10px; color: var(--gray-500); padding: 0 6px; }

  /* ── 모달 ── */
  #modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 1000; align-items: center; justify-content: center; }
  #modal-overlay.show { display: flex; }
  .modal { background: var(--white); width: 560px; max-width: 95vw; max-height: 80vh; overflow-y: auto; }
  .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--gray-100); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--white); }
  .modal-title { font-size: 14px; font-weight: 800; }
  .modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--gray-500); }
  .modal-body { padding: 20px; }
  .modal-row { display: flex; padding: 8px 0; border-bottom: 1px solid var(--gray-100); font-size: 12px; }
  .modal-row:last-child { border-bottom: none; }
  .modal-key { width: 120px; font-weight: 700; color: var(--gray-500); flex-shrink: 0; }
  .modal-val { flex: 1; word-break: break-all; }
  .modal-link { color: var(--blue); text-decoration: underline; cursor: pointer; }

  /* ── 로딩/빈 상태 ── */
  .loading { padding: 32px; text-align: center; color: var(--gray-500); font-size: 12px; }
  .empty { padding: 28px; text-align: center; color: var(--gray-300); font-size: 12px; }

  /* ── 반응형 ── */
  @media (max-width: 1100px) { .summary-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 768px) {
    .summary-grid { grid-template-columns: repeat(2, 1fr); }
    .cards-4 { grid-template-columns: repeat(2, 1fr); }
    .cards-2 { grid-template-columns: 1fr; }
    main { padding: 16px; }
    header, .filter-bar { padding: 0 16px; }
    #issue-banner { padding: 10px 16px; }
    .modal { width: 100%; max-width: 100%; max-height: 90vh; }
  }
  @media (max-width: 480px) {
    .summary-grid { grid-template-columns: 1fr 1fr; }
    .cards-4 { grid-template-columns: 1fr 1fr; }
    table { font-size: 11px; }
    th, td { padding: 7px 8px; }
  }
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">NIKE <span>INSPECTOR</span></div>
    <div class="login-sub">DTC3팀 · 검수 대시보드</div>
    <input class="login-input" id="pw-input" type="password" placeholder="비밀번호를 입력하세요" maxlength="20" />
    <button class="login-btn" onclick="checkPassword()">입장하기</button>
    <div class="login-error" id="login-error">비밀번호가 올바르지 않습니다</div>
  </div>
</div>

<!-- 대시보드 -->
<div id="dashboard">
  <header>
    <div class="header-logo">NIKE <span>INSPECTOR</span> · DTC3</div>
    <div class="header-right">
      <span class="auto-badge" id="auto-badge">● 자동갱신</span>
      <span class="header-time" id="header-time"></span>

  </header>

  <!-- 새 데이터 배너 -->
  <div id="new-data-banner" onclick="dismissNewBanner()">🔔 새 검수 데이터가 있습니다. 클릭하여 새로고침</div>

  <!-- 이슈 배너 -->
  <div id="issue-banner" id="issue-banner"></div>

  <!-- 사용자 필터 -->
  <div class="filter-bar">
    <span class="filter-label">사용자</span>
    <button class="chip active" data-user="all" onclick="setUser(this)">전체</button>
    <div id="user-chips" style="display:flex;gap:6px;"></div>
    <span class="filter-label" style="margin-left:12px;">기간</span>

  <main>

    <!-- 사용자별 현황 -->

    <div class="cards cards-2">
      <div class="table-wrap">
        <div class="table-header"><span class="table-title">일반 검수</span></div>
        <div id="user-inspect-wrap"><div class="loading">로딩 중...</div></div>

        <div class="table-header"><span class="table-title">검수 상태 분포</span></div>
        <div class="donut-wrap" id="chart-status-dist"></div>
      </div>
      <div class="table-wrap">
        <div class="table-header"><span class="table-title">카테고리 Top5</span></div>

      </div>

    <!-- PW검수 -->

    <div class="table-wrap" style="margin-top:10px;">

    <!-- 이슈 -->

    <div class="cards cards-4" id="issue-cards"></div>
    <div class="table-wrap" style="margin-top:10px;">

        <span class="table-title">이슈 제품 목록</span>

      </div>

    <div style="height:40px;"></div>

</div>

      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

// ── 비밀번호 ──────────────────────────────────────────────────
function checkPassword() {
  const val = document.getElementById('pw-input').value.trim().toUpperCase();
  if (val === PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    sessionStorage.setItem('auth', '1');
    loadAll();
    startAutoRefresh();
  } else {
    const err = document.getElementById('login-error');
    err.style.display = 'block';
    setTimeout(() => err.style.display = 'none', 2000);
    document.getElementById('pw-input').value = '';
  }
}
document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') checkPassword(); });
if (sessionStorage.getItem('auth') === '1') {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
}

// ── 시간 ─────────────────────────────────────────────────────
function updateTime() {
  document.getElementById('header-time').textContent =
    new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' });
}
updateTime(); setInterval(updateTime, 1000);

// ── 자동 새로고침 (30초) ─────────────────────────────────────
function startAutoRefresh() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(async () => {
    const [insp, badge] = await Promise.all([
      supabaseFetch('inspections', 'order=created_at.desc'),
      supabaseFetch('badge_inspections', 'order=created_at.desc')
    ]);
    const newCount = insp.length + badge.length;
    if (newCount > lastCount && lastCount > 0) {
      showNewBanner(newCount - lastCount);
    } else {
      allInspections = insp; allBadge = badge;
      lastCount = newCount;
      renderAll();
    }
  }, 30000);
}

function showNewBanner(n) {
  const b = document.getElementById('new-data-banner');
  b.textContent = `🔔 새 검수 데이터 ${n}건이 있습니다. 클릭하여 새로고침`;
  b.style.display = 'block';
}

function dismissNewBanner() {
  document.getElementById('new-data-banner').style.display = 'none';
  loadAll();
}

// ── Supabase ─────────────────────────────────────────────────
async function supabaseFetch(table, params = '') {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}&limit=5000`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function loadAll() {
  document.getElementById('new-data-banner').style.display = 'none';
  try {
    const [insp, badge] = await Promise.all([
      supabaseFetch('inspections', 'order=created_at.desc'),
      supabaseFetch('badge_inspections', 'order=created_at.desc')
    ]);
    allInspections = insp; allBadge = badge;
    lastCount = insp.length + badge.length;

    // 사용자 칩
    const users = [...new Set([...insp, ...badge].map(r => r.user_name).filter(Boolean))];
    document.getElementById('user-chips').innerHTML = users.map(u =>
      `<button class="chip" data-user="${u}" onclick="setUser(this)">${u}</button>`
    ).join('');

    renderAll();
    if (sessionStorage.getItem('auth') === '1') startAutoRefresh();
  } catch(e) { console.error('로드 오류:', e); }
}

// ── 필터 ─────────────────────────────────────────────────────
function filterByDate(rows) {
  if (selectedDays === 0) return rows;
  const d = new Date(); d.setDate(d.getDate() - (selectedDays - 1)); d.setHours(0,0,0,0);
  return rows.filter(r => new Date(r.created_at) >= d);
}
function filterByUser(rows) {
  return selectedUser === 'all' ? rows : rows.filter(r => r.user_name === selectedUser);
}
function applyFilters(rows) { return filterByUser(filterByDate(rows)); }

function setUser(el) {
  document.querySelectorAll('.chip[data-user]').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  selectedUser = el.dataset.user;
  resetInspectPage(); renderAll();
}
function setDate(el) {
  document.querySelectorAll('.chip[data-days]').forEach(c => c.classList.remove('active', 'orange'));
  el.classList.add('active', 'orange');
  selectedDays = parseInt(el.dataset.days);
  resetInspectPage(); renderAll();
}

function renderAll() {
  renderSummary();
  renderBadgeSection();
  renderIssueSection();
  renderInspectTable();
  renderUserStats();
  renderCharts();
}

      <div class="sum-label">이슈</div>
      <div class="sum-value">${issues}</div>

      <div class="sum-value">${badge.length}</div>
      <div class="sum-sub">뱃징 전용 검수</div>

// ── 검수 내역 ─────────────────────────────────────────────────
function resetInspectPage() { inspectPage = 1; renderInspectTable(); }
function resetInspectFilters() {
  ['search-input','f-mode','f-status','f-kc','f-badge'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  resetInspectPage();
}

function getInspectFiltered() {
  const kw = (document.getElementById('search-input')?.value||'').trim().toUpperCase();
  const fm = document.getElementById('f-mode')?.value||'';
  const fs = document.getElementById('f-status')?.value||'';
  const fk = document.getElementById('f-kc')?.value||'';
  const fb = document.getElementById('f-badge')?.value||'';
  return applyFilters(allInspections).filter(r => {
    if (kw && !(r.input_style_num||'').toUpperCase().includes(kw) && !(r.product_name||'').includes(kw)) return false;
    if (fm && (r.inspect_mode||'LIVE') !== fm) return false;
    if (fs && !(r.status||'').includes(fs)) return false;
    if (fk && (r.kc_certification||'') !== fk) return false;
    if (fb && (r.badge||'x') !== fb) return false;
    return true;
  });
}

function renderInspectTable() {
  const rows = getInspectFiltered();
  const total = rows.length;
  const totalPages = Math.max(1, Math.ceil(total/PAGE_SIZE));
  if (inspectPage > totalPages) inspectPage = totalPages;
  const pageRows = rows.slice((inspectPage-1)*PAGE_SIZE, inspectPage*PAGE_SIZE);

  document.getElementById('inspect-count').textContent = `${total}건 · ${inspectPage}/${totalPages}페이지`;

  if (!rows.length) {
    document.getElementById('inspect-table-wrap').innerHTML = '<div class="empty">데이터가 없습니다</div>';
    document.getElementById('inspect-pagination').innerHTML = '';
    return;
  }

  document.getElementById('inspect-table-wrap').innerHTML = `<div style="overflow-x:auto;"><table>
    <thead><tr><th>검수일시</th><th>사용자</th><th>모드</th><th>스타일번호</th><th>제품명</th>
    <th>카테고리</th><th>뱃징</th><th>판매가격</th><th>할인율</th><th>KC인증</th><th>쿠폰불가</th><th>제조국</th><th>상태</th></tr></thead>
    <tbody>${pageRows.map(r => `<tr onclick="showModal(${JSON.stringify(r).replace(/"/g,'&quot;')})">
      <td>${fmtDate(r.created_at)}</td><td>${r.user_name||''}</td>
      <td>${modeChip(r.inspect_mode)}</td>
      <td style="font-family:monospace;font-weight:700;">${r.input_style_num||''}</td>
      <td>${r.product_name||''}</td><td>${r.category||''}</td>
      <td>${badgeChip(r.badge)}</td>
      <td style="text-align:right;">${r.sale_price ? r.sale_price+' 원' : '-'}</td>
      <td style="text-align:center;">${(r.discount_rate||'-').replace(' 할인','')}</td>
      <td style="text-align:center;">${kcChip(r.kc_certification)}</td>
      <td style="text-align:center;">${r.coupon_unavailable||'-'}</td>
      <td>${r.manufacture_country||''}</td>
      <td>${statusChip(r.status)}</td>
    </tr>`).join('')}</tbody>
  </table></div>`;

  // 페이지네이션
  const pag = document.getElementById('inspect-pagination');
  if (totalPages <= 1) { pag.innerHTML = ''; return; }
  let btns = `<button class="page-btn" onclick="goPage(${inspectPage-1})" ${inspectPage===1?'disabled':''}>‹</button>`;
  let s = Math.max(1, inspectPage-3), e = Math.min(totalPages, s+6);
  if (e-s < 6) s = Math.max(1, e-6);
  if (s > 1) btns += `<button class="page-btn" onclick="goPage(1)">1</button><span class="page-info">…</span>`;
  for (let i = s; i <= e; i++) btns += `<button class="page-btn ${i===inspectPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
  if (e < totalPages) btns += `<span class="page-info">…</span><button class="page-btn" onclick="goPage(${totalPages})">${totalPages}</button>`;
  btns += `<button class="page-btn" onclick="goPage(${inspectPage+1})" ${inspectPage===totalPages?'disabled':''}>›</button>`;
  btns += `<span class="page-info">${(inspectPage-1)*PAGE_SIZE+1}–${Math.min(inspectPage*PAGE_SIZE,total)} / ${total}</span>`;
  pag.innerHTML = btns;
}

function goPage(p) {
  const total = getInspectFiltered().length;
  inspectPage = Math.max(1, Math.min(p, Math.ceil(total/PAGE_SIZE)));
  renderInspectTable();
  document.getElementById('inspect-table-wrap')?.scrollIntoView({behavior:'smooth', block:'start'});
}

// ── 사용자 현황 ──────────────────────────────────────────────
function renderUserStats() {
  function buildStats(rows) {
    const m = {}; rows.forEach(r => { m[r.user_name]=(m[r.user_name]||0)+1; });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);
  }
  function renderStat(el, rows) {
    const sorted = buildStats(rows); const max = sorted[0]?.[1]||1;
    if (!sorted.length) { el.innerHTML = '<div class="empty">데이터 없음</div>'; return; }
    el.innerHTML = sorted.map(([name,cnt]) => `
      <div class="user-stat-row">
        <div class="user-avatar">${name.charAt(0)}</div>
        <div class="user-stat-name">${name}</div>
        <div class="user-stat-bar-wrap"><div class="user-stat-bar" style="width:${Math.round(cnt/max*100)}%"></div></div>
        <div class="user-stat-num">${cnt}</div>
      </div>`).join('');
  }
  renderStat(document.getElementById('user-inspect-wrap'), applyFilters(allInspections));
  renderStat(document.getElementById('user-badge-wrap'), applyFilters(allBadge));
}

// ── 차트 ─────────────────────────────────────────────────────
function renderCharts() {
  const rows = applyFilters(allInspections);

  // 일별 차트
  const byDate = {};
  rows.forEach(r => { const d = r.created_at?.slice(0,10); if(d) byDate[d]=(byDate[d]||0)+1; });
  const dates = Object.keys(byDate).sort().slice(-14);
  const maxD = Math.max(...dates.map(d=>byDate[d]), 1);
  document.getElementById('chart-daily').innerHTML = dates.length ? `
    <div class="chart-bar-wrap">
      ${dates.map(d => `<div class="chart-col">
        <div class="chart-val">${byDate[d]}</div>
        <div class="chart-bar" style="height:${Math.round(byDate[d]/maxD*80)}px;"></div>
        <div class="chart-label">${d.slice(5)}</div>
      </div>`).join('')}
    </div>` : '<div class="empty">데이터 없음</div>';

  // 검수 상태 분포
  const statusMap = {'done':'완료','snkrs':'SNKRS','mismatch':'불일치','timeout':'타임아웃','no_result':'검색없음','done_tracking':'트레킹완료','not_found_tracking':'미발견'};
  const statusColors = {'done':'#1A6B3C','snkrs':'#6B1A6B','mismatch':'#E67E22','timeout':'#E4002B','no_result':'#888','done_tracking':'#1A3A6B','not_found_tracking':'#CCCCCC'};
  const byStatus = {};
  rows.forEach(r => { const s=r.status||'done'; byStatus[s]=(byStatus[s]||0)+1; });
  const statusEntries = Object.entries(byStatus).sort((a,b)=>b[1]-a[1]);
  const totalS = statusEntries.reduce((s,[,v])=>s+v,0)||1;
  document.getElementById('chart-status-dist').innerHTML = statusEntries.length ? `
    <svg width="80" height="80" viewBox="0 0 80 80">
      ${(() => {
        let offset = 0;
        return statusEntries.map(([name,cnt]) => {
          const pct = cnt/totalS; const deg = pct*360;
          const r=30, cx=40, cy=40;
          const startAngle = offset * Math.PI/180;
          const endAngle = (offset+deg) * Math.PI/180;
          const x1=cx+r*Math.sin(startAngle), y1=cy-r*Math.cos(startAngle);
          const x2=cx+r*Math.sin(endAngle), y2=cy-r*Math.cos(endAngle);
          const large = deg > 180 ? 1 : 0;
          offset += deg;
          return `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} Z" fill="${statusColors[name]||'#888'}"/>`;
        }).join('');
      })()}
      <circle cx="40" cy="40" r="18" fill="white"/>
    </svg>
    <div class="donut-legend">
      ${statusEntries.map(([name,cnt]) => `
        <div class="legend-item">
          <div class="legend-dot" style="background:${statusColors[name]||'#888'};"></div>
          <span>${statusMap[name]||name}</span>
          <span style="margin-left:auto;font-weight:700;">${cnt}</span>
        </div>`).join('')}
    </div>` : '<div class="empty">데이터 없음</div>';

  // 카테고리 Top5
  const byCat = {};
  rows.forEach(r => { if(r.category) byCat[r.category]=(byCat[r.category]||0)+1; });
  const catEntries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxC = catEntries[0]?.[1]||1;
  document.getElementById('chart-category').innerHTML = catEntries.length ? catEntries.map(([name,cnt]) => `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
      <div style="font-size:11px;width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${name}</div>
      <div style="flex:1;height:6px;background:var(--gray-100);border-radius:3px;overflow:hidden;">
        <div style="width:${Math.round(cnt/maxC*100)}%;height:100%;background:var(--orange);border-radius:3px;"></div>
      </div>
      <div style="font-size:11px;font-weight:700;min-width:24px;text-align:right;">${cnt}</div>
    </div>`).join('') : '<div class="empty">데이터 없음</div>';
}

// ── 모달 ─────────────────────────────────────────────────────
function showModal(r) {
  const fields = [
    ['검수일시', fmtDate(r.created_at)],
    ['사용자', r.user_name],
    ['모드', r.inspect_mode || 'LIVE'],
    ['스타일번호(입력)', r.input_style_num || r.style_num],
    ['스타일번호(페이지)', r.page_style_num],
    ['제품명', r.product_name],
    ['카테고리', r.category],
    ['뱃징', r.badge],
    ['판매가격', r.sale_price ? r.sale_price + ' 원' : '-'],
    ['할인율', (r.discount_rate||'-').replace(' 할인','')],
    ['KC인증', r.kc_certification],
    ['사이즈', r.sizes],
    ['쿠폰불가', r.coupon_unavailable],
    ['제조국', r.manufacture_country],
    ['제조자/수입자', r.importer_manufacturer],
    ['비고', r.notes],
    ['상태', r.status],
    ['URL', r.product_url],
  ];
  document.getElementById('modal-title').textContent = r.input_style_num || r.style_num || '상세 정보';
  document.getElementById('modal-body').innerHTML = fields.filter(([,v])=>v).map(([k,v]) => `
    <div class="modal-row">
      <div class="modal-key">${k}</div>
      <div class="modal-val">${k==='URL' ? `<a class="modal-link" href="${v}" target="_blank">${v}</a>` : v}</div>
    </div>`).join('');
  document.getElementById('modal-overlay').classList.add('show');
}
function closeModal(e) {
  if (!e || e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('show');
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── 헬퍼 ─────────────────────────────────────────────────────
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const kst = new Date(d.getTime() + 9*60*60*1000);
  return (kst.getUTCMonth()+1) + '/' + kst.getUTCDate() + ' ' +
    String(kst.getUTCHours()).padStart(2,'0') + ':' + String(kst.getUTCMinutes()).padStart(2,'0');
}
function badgeChip(b) {
  if (!b || b==='x') return '<span class="badge badge-gray">-</span>';
  if (b==='신제품') return `<span class="badge badge-green">${b}</span>`;
  if (b==='베스트셀러') return `<span class="badge badge-orange">${b}</span>`;
  if (b==='품절') return `<span class="badge badge-red">${b}</span>`;
  return `<span class="badge badge-blue">${b}</span>`;
}
function kcChip(kc) {
  if (kc==='O') return '<span class="badge badge-green">O</span>';
  if (kc==='△') return '<span class="badge badge-amber">△</span>';
  return '<span class="badge badge-gray">-</span>';
}
function statusChip(s) {
  if (!s) return '';
  if (s==='done'||s==='완료') return '<span class="badge badge-green">완료</span>';
  if (s==='snkrs'||s==='SNKRS') return '<span class="badge badge-purple">SNKRS</span>';
  if (s==='timeout'||s==='타임아웃') return '<span class="badge badge-red">타임아웃</span>';
  if (s==='mismatch'||s==='검색불일치') return '<span class="badge badge-amber">불일치</span>';
  if (s==='done_tracking') return '<span class="badge badge-blue">트레킹완료</span>';
  if (s==='not_found_tracking') return '<span class="badge badge-amber">미발견</span>';
  return `<span class="badge badge-gray">${s}</span>`;
}
function modeChip(m) {
  if (!m||m==='LIVE') return '<span class="badge badge-blue">LIVE</span>';
  if (m==='STEALTH') return '<span class="badge badge-gray">STEALTH</span>';
  if (m==='뱃징') return '<span class="badge badge-orange">뱃징</span>';
  return `<span class="badge badge-gray">${m}</span>`;
}

// ── 초기 로드 ─────────────────────────────────────────────────
if (sessionStorage.getItem('auth') === '1') { loadAll(); startAutoRefresh(); }
</script>
