<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nike Inspector · DTC3 대시보드</title>
<style>
  :root {
    --black: #111111;
    --white: #FFFFFF;
    --gray-50: #F8F8F8;
    --gray-100: #EEEEEE;
    --gray-300: #CCCCCC;
    --gray-500: #888888;
    --gray-700: #444444;
    --nike-orange: #FF6B00;
    --nike-red: #E4002B;
    --green: #1A6B3C;
    --green-light: #E8F5EE;
    --amber: #E67E22;
    --amber-light: #FEF3E2;
    --red-light: #FDE8EC;
    --blue: #1A3A6B;
    --blue-light: #E8EEF8;
    --purple: #6B1A6B;
    --purple-light: #F5E8F5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: var(--gray-50);
    color: var(--black);
    min-height: 100vh;
  }

  /* ── 로그인 화면 ── */
  #login-screen {
    position: fixed; inset: 0;
    background: var(--black);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
    flex-direction: column; gap: 0;
  }
  .login-box {
    width: 360px;
    padding: 48px 40px;
    background: #1A1A1A;
    border: 1px solid #333;
  }
  .login-logo {
    font-size: 28px; font-weight: 900; letter-spacing: -1px;
    color: var(--white); margin-bottom: 6px;
  }
  .login-logo span { color: var(--nike-orange); }
  .login-sub {
    font-size: 11px; color: var(--gray-500);
    letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 36px;
  }
  .login-input {
    width: 100%; padding: 14px 16px;
    background: #2A2A2A; border: 1px solid #444;
    color: var(--white); font-size: 16px; letter-spacing: 4px;
    outline: none; transition: border-color .2s;
    font-family: monospace;
  }
  .login-input:focus { border-color: var(--nike-orange); }
  .login-input::placeholder { letter-spacing: 1px; color: #666; font-size: 13px; font-family: sans-serif; }
  .login-btn {
    width: 100%; margin-top: 12px; padding: 14px;
    background: var(--nike-orange); border: none;
    color: var(--white); font-size: 13px; font-weight: 800;
    letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer; transition: background .2s;
  }
  .login-btn:hover { background: #E05A00; }
  .login-error {
    margin-top: 10px; font-size: 12px; color: var(--nike-red);
    display: none; text-align: center;
  }

  /* ── 대시보드 ── */
  #dashboard { display: none; }

  header {
    background: var(--black); padding: 0 32px;
    display: flex; align-items: center; justify-content: space-between;
    height: 56px; position: sticky; top: 0; z-index: 100;
  }
  .header-logo {
    font-size: 15px; font-weight: 900; letter-spacing: -0.5px; color: var(--white);
  }
  .header-logo span { color: var(--nike-orange); }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .header-time { font-size: 11px; color: var(--gray-500); }
  .btn-refresh {
    padding: 6px 14px; background: #222; border: 1px solid #444;
    color: var(--white); font-size: 11px; font-weight: 700;
    letter-spacing: 1px; cursor: pointer; transition: all .2s;
  }
  .btn-refresh:hover { background: var(--nike-orange); border-color: var(--nike-orange); }

  /* ── 사용자 필터 ── */
  .user-filter-bar {
    background: var(--white); border-bottom: 1px solid var(--gray-100);
    padding: 0 32px; display: flex; align-items: center; gap: 8px; height: 48px;
  }
  .filter-label { font-size: 11px; font-weight: 700; color: var(--gray-500); letter-spacing: 1px; margin-right: 4px; }
  .user-chip {
    padding: 5px 14px; border: 1.5px solid var(--gray-300);
    background: var(--white); font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all .15s; border-radius: 20px; color: var(--gray-700);
  }
  .user-chip.active {
    background: var(--black); border-color: var(--black); color: var(--white);
  }
  .user-chip:hover:not(.active) { border-color: var(--black); }

  /* ── 날짜 필터 ── */
  .date-filter-bar {
    background: var(--white); border-bottom: 1px solid var(--gray-100);
    padding: 0 32px; display: flex; align-items: center; gap: 8px; height: 44px;
  }
  .date-chip {
    padding: 4px 12px; border: 1.5px solid var(--gray-300);
    background: var(--white); font-size: 11px; font-weight: 600;
    cursor: pointer; transition: all .15s; border-radius: 20px; color: var(--gray-700);
  }
  .date-chip.active { background: var(--nike-orange); border-color: var(--nike-orange); color: var(--white); }

  /* ── 메인 ── */
  main { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }

  /* ── 섹션 타이틀 ── */
  .section-title {
    font-size: 11px; font-weight: 800; letter-spacing: 2px;
    text-transform: uppercase; color: var(--gray-500);
    margin-bottom: 14px; margin-top: 32px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title:first-child { margin-top: 0; }
  .section-title::after {
    content: ''; flex: 1; height: 1px; background: var(--gray-100);
  }

  /* ── 카드 그리드 ── */
  .cards { display: grid; gap: 12px; margin-bottom: 4px; }
  .cards-4 { grid-template-columns: repeat(4, 1fr); }
  .cards-3 { grid-template-columns: repeat(3, 1fr); }
  .cards-2 { grid-template-columns: repeat(2, 1fr); }

  .card {
    background: var(--white); padding: 20px 24px;
    border: 1px solid var(--gray-100);
  }
  .card-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gray-500); margin-bottom: 8px; }
  .card-value { font-size: 32px; font-weight: 900; letter-spacing: -1px; line-height: 1; }
  .card-sub { font-size: 11px; color: var(--gray-500); margin-top: 4px; }
  .card.orange .card-value { color: var(--nike-orange); }
  .card.green .card-value { color: var(--green); }
  .card.red .card-value { color: var(--nike-red); }
  .card.blue .card-value { color: var(--blue); }

  /* ── 테이블 ── */
  .table-wrap { background: var(--white); border: 1px solid var(--gray-100); overflow: hidden; }
  .table-header {
    padding: 14px 20px; border-bottom: 1px solid var(--gray-100);
    display: flex; align-items: center; justify-content: space-between;
  }
  .table-title { font-size: 12px; font-weight: 800; letter-spacing: .5px; }
  .table-count { font-size: 11px; color: var(--gray-500); }
  .search-input {
    padding: 6px 12px; border: 1px solid var(--gray-300);
    font-size: 12px; outline: none; width: 200px; transition: border-color .2s;
  }
  .search-input:focus { border-color: var(--black); }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th {
    padding: 10px 14px; text-align: left; font-size: 10px;
    font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--gray-500); background: var(--gray-50);
    border-bottom: 1px solid var(--gray-100); white-space: nowrap;
  }
  td {
    padding: 10px 14px; border-bottom: 1px solid var(--gray-100);
    vertical-align: middle; max-width: 200px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--gray-50); }

  .badge {
    display: inline-block; padding: 2px 8px;
    font-size: 10px; font-weight: 700; letter-spacing: .5px;
    border-radius: 3px;
  }
  .badge-green { background: var(--green-light); color: var(--green); }
  .badge-amber { background: var(--amber-light); color: var(--amber); }
  .badge-red { background: var(--red-light); color: var(--nike-red); }
  .badge-blue { background: var(--blue-light); color: var(--blue); }
  .badge-purple { background: var(--purple-light); color: var(--purple); }
  .badge-gray { background: var(--gray-100); color: var(--gray-500); }
  .badge-orange { background: #FFF0E6; color: var(--nike-orange); }

  /* ── 사용자 현황 ── */
  .user-stat-row {
    display: flex; align-items: center; padding: 12px 20px;
    border-bottom: 1px solid var(--gray-100); gap: 12px;
  }
  .user-stat-row:last-child { border-bottom: none; }
  .user-avatar {
    width: 32px; height: 32px; background: var(--black);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800; color: var(--white); flex-shrink: 0;
  }
  .user-stat-name { font-size: 13px; font-weight: 700; flex: 1; }
  .user-stat-bar-wrap { flex: 2; height: 6px; background: var(--gray-100); border-radius: 3px; overflow: hidden; }
  .user-stat-bar { height: 100%; background: var(--nike-orange); border-radius: 3px; transition: width .6s ease; }
  .user-stat-num { font-size: 13px; font-weight: 800; min-width: 40px; text-align: right; }

  /* ── 로딩 ── */
  .loading {
    padding: 40px; text-align: center; color: var(--gray-500);
    font-size: 12px; letter-spacing: 1px;
  }
  .empty {
    padding: 32px; text-align: center; color: var(--gray-300);
    font-size: 12px;
  }

  /* ── 반응형 ── */
  @media (max-width: 900px) {
    .cards-4 { grid-template-columns: repeat(2, 1fr); }
    main { padding: 20px 16px; }
    header { padding: 0 16px; }
    .user-filter-bar, .date-filter-bar { padding: 0 16px; overflow-x: auto; }
  }
</style>
</head>
<body>

<!-- ── 로그인 ── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">NIKE <span>INSPECTOR</span></div>
    <div class="login-sub">DTC3팀 · 검수 대시보드</div>
    <input class="login-input" id="pw-input" type="password" placeholder="비밀번호를 입력하세요" maxlength="20" />
    <button class="login-btn" onclick="checkPassword()">입장하기</button>
    <div class="login-error" id="login-error">비밀번호가 올바르지 않습니다</div>
  </div>
</div>

<!-- ── 대시보드 ── -->
<div id="dashboard">
  <header>
    <div class="header-logo">NIKE <span>INSPECTOR</span> · DTC3</div>
    <div class="header-right">
      <span class="header-time" id="header-time"></span>
      <button class="btn-refresh" onclick="loadAll()">↻ 새로고침</button>
    </div>
  </header>

  <!-- 사용자 필터 -->
  <div class="user-filter-bar">
    <span class="filter-label">사용자</span>
    <button class="user-chip active" data-user="all" onclick="setUser(this)">전체</button>
    <div id="user-chips"></div>
  </div>

  <!-- 날짜 필터 -->
  <div class="date-filter-bar">
    <span class="filter-label">기간</span>
    <button class="date-chip active" data-days="1" onclick="setDate(this)">오늘</button>
    <button class="date-chip" data-days="7" onclick="setDate(this)">7일</button>
    <button class="date-chip" data-days="30" onclick="setDate(this)">30일</button>
    <button class="date-chip" data-days="0" onclick="setDate(this)">전체</button>
  </div>

  <main>
    <!-- ① PW검수(뱃징) 현황 -->
    <div class="section-title">🏷 PW검수 · 뱃징 현황</div>
    <div class="cards cards-4" id="badge-cards">
      <div class="card"><div class="loading">로딩 중...</div></div>
    </div>
    <div class="table-wrap" style="margin-top:12px;">
      <div class="table-header">
        <span class="table-title">PW검수 내역</span>
        <span class="table-count" id="badge-count"></span>
      </div>
      <div id="badge-table-wrap"><div class="loading">로딩 중...</div></div>
    </div>

    <!-- ② 이슈 제품 -->
    <div class="section-title">⚠️ 이슈 제품</div>
    <div class="cards cards-4" id="issue-cards">
      <div class="card"><div class="loading">로딩 중...</div></div>
    </div>
    <div class="table-wrap" style="margin-top:12px;">
      <div class="table-header">
        <span class="table-title">이슈 제품 목록</span>
        <span class="table-count" id="issue-count"></span>
      </div>
      <div id="issue-table-wrap"><div class="loading">로딩 중...</div></div>
    </div>

    <!-- ③ 최근 검수 내역 -->
    <div class="section-title">📋 최근 검수 내역</div>
    <div class="table-wrap">
      <div class="table-header">
        <span class="table-title">검수 결과</span>
        <div style="display:flex;gap:8px;align-items:center;">
          <span class="table-count" id="inspect-count"></span>
          <input class="search-input" id="search-input" placeholder="스타일번호 / 제품명 검색" oninput="renderInspectTable()">
        </div>
      </div>
      <div id="inspect-table-wrap"><div class="loading">로딩 중...</div></div>
    </div>

    <!-- ④ 사용자별 현황 -->
    <div class="section-title">👤 사용자별 현황</div>
    <div class="cards cards-2">
      <div class="table-wrap">
        <div class="table-header"><span class="table-title">일반 검수</span></div>
        <div id="user-inspect-wrap"><div class="loading">로딩 중...</div></div>
      </div>
      <div class="table-wrap">
        <div class="table-header"><span class="table-title">PW검수</span></div>
        <div id="user-badge-wrap"><div class="loading">로딩 중...</div></div>
      </div>
    </div>

    <!-- ⑤ 날짜별 차트 -->
    <div class="section-title">📈 날짜별 검수량</div>
    <div class="table-wrap">
      <div class="table-header"><span class="table-title">일별 추이</span></div>
      <div id="chart-wrap" style="padding:20px 24px;"></div>
    </div>

    <div style="height:40px;"></div>
  </main>
</div>

<script>
const SUPABASE_URL = 'https://yaihltefbhoheunrhkhn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XzqxPVRM40KBo9DgNv15Nw_dl3dY1qb';
const PASSWORD     = 'IBANK';

let allInspections   = [];
let allBadge         = [];
let selectedUser     = 'all';
let selectedDays     = 1;

// ── 비밀번호 ──────────────────────────────────────────────────
function checkPassword() {
  const val = document.getElementById('pw-input').value.trim().toUpperCase();
  if (val === PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    sessionStorage.setItem('auth', '1');
    loadAll();
  } else {
    const err = document.getElementById('login-error');
    err.style.display = 'block';
    setTimeout(() => err.style.display = 'none', 2000);
    document.getElementById('pw-input').value = '';
  }
}
document.getElementById('pw-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkPassword();
});
if (sessionStorage.getItem('auth') === '1') {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
}

// ── 시간 표시 ─────────────────────────────────────────────────
function updateTime() {
  const now = new Date();
  document.getElementById('header-time').textContent =
    now.toLocaleDateString('ko-KR') + ' ' + now.toLocaleTimeString('ko-KR');
}
updateTime();
setInterval(updateTime, 1000);

// ── Supabase ──────────────────────────────────────────────────
async function supabaseFetch(table, params = '') {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}&limit=2000`, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY
    }
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// ── 날짜 필터 ─────────────────────────────────────────────────
function getDateFilter() {
  if (selectedDays === 0) return '';
  const d = new Date();
  d.setDate(d.getDate() - (selectedDays - 1));
  d.setHours(0, 0, 0, 0);
  return `created_at=gte.${d.toISOString()}`;
}

function filterByDate(rows) {
  if (selectedDays === 0) return rows;
  const d = new Date();
  d.setDate(d.getDate() - (selectedDays - 1));
  d.setHours(0, 0, 0, 0);
  return rows.filter(r => new Date(r.created_at) >= d);
}

function filterByUser(rows) {
  if (selectedUser === 'all') return rows;
  return rows.filter(r => r.user_name === selectedUser);
}

function applyFilters(rows) {
  return filterByUser(filterByDate(rows));
}

// ── 필터 이벤트 ───────────────────────────────────────────────
function setUser(el) {
  document.querySelectorAll('.user-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  selectedUser = el.dataset.user;
  renderAll();
}

function setDate(el) {
  document.querySelectorAll('.date-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  selectedDays = parseInt(el.dataset.days);
  renderAll();
}

// ── 데이터 로드 ───────────────────────────────────────────────
async function loadAll() {
  try {
    const [insp, badge] = await Promise.all([
      supabaseFetch('inspections', 'order=created_at.desc'),
      supabaseFetch('badge_inspections', 'order=created_at.desc')
    ]);
    allInspections = insp;
    allBadge       = badge;

    // 사용자 칩 생성
    const users = [...new Set([...insp, ...badge].map(r => r.user_name).filter(Boolean))];
    const chipsEl = document.getElementById('user-chips');
    chipsEl.innerHTML = users.map(u =>
      `<button class="user-chip" data-user="${u}" onclick="setUser(this)">${u}</button>`
    ).join('');

    renderAll();
  } catch(e) {
    console.error('데이터 로드 오류:', e);
  }
}

function renderAll() {
  renderBadgeSection();
  renderIssueSection();
  renderInspectTable();
  renderUserStats();
  renderChart();
}

// ── ① PW검수 섹션 ────────────────────────────────────────────
function renderBadgeSection() {
  const rows = applyFilters(allBadge);
  const total = rows.length;
  const byBadge = {};
  rows.forEach(r => {
    const b = r.badge || 'x';
    byBadge[b] = (byBadge[b] || 0) + 1;
  });

  const cards = [
    { label: '총 PW검수', value: total, cls: 'orange' },
    { label: '신제품', value: byBadge['신제품'] || 0, cls: 'green' },
    { label: '베스트셀러', value: byBadge['베스트셀러'] || 0, cls: 'blue' },
    { label: '뱃징 없음', value: byBadge['x'] || 0, cls: '' }
  ];

  document.getElementById('badge-cards').innerHTML = cards.map(c => `
    <div class="card ${c.cls}">
      <div class="card-label">${c.label}</div>
      <div class="card-value">${c.value}</div>
    </div>
  `).join('');

  document.getElementById('badge-count').textContent = total + '건';

  if (!rows.length) {
    document.getElementById('badge-table-wrap').innerHTML = '<div class="empty">데이터가 없습니다</div>';
    return;
  }

  document.getElementById('badge-table-wrap').innerHTML = `
    <div style="overflow-x:auto;">
    <table>
      <thead><tr>
        <th>검수일시</th><th>사용자</th><th>모드</th><th>스타일번호</th><th>제품명</th>
        <th>뱃징</th><th>판매가격</th><th>할인율</th>
      </tr></thead>
      <tbody>
        ${rows.slice(0, 100).map(r => `<tr>
          <td>${fmtDate(r.created_at)}</td>
          <td>${r.user_name || ''}</td>
          <td>${modeChip(r.inspect_mode)}</td>
          <td style="font-family:monospace;font-weight:700;">${r.style_num || ''}</td>
          <td>${r.product_name || ''}</td>
          <td>${badgeChip(r.badge)}</td>
          <td style="text-align:right;">${r.sale_price ? r.sale_price + ' 원' : '-'}</td>
          <td style="text-align:center;">${r.discount_rate || '-'}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>
  `;
}

// ── ② 이슈 섹션 ──────────────────────────────────────────────
function renderIssueSection() {
  const rows = applyFilters(allInspections);
  const kc      = rows.filter(r => r.kc_certification === '△');
  const mismatch = rows.filter(r => r.status === 'mismatch' || r.status === '검색불일치');
  const snkrs   = rows.filter(r => r.status === 'snkrs' || r.status === 'SNKRS');
  const timeout = rows.filter(r => r.status === 'timeout' || r.status === '타임아웃');
  const issues  = rows.filter(r => r.notes && r.notes.trim() !== '');

  document.getElementById('issue-cards').innerHTML = `
    <div class="card amber"><div class="card-label">KC 확인필요 (△)</div><div class="card-value">${kc.length}</div></div>
    <div class="card red"><div class="card-label">검색불일치</div><div class="card-value">${mismatch.length}</div></div>
    <div class="card blue"><div class="card-label">SNKRS 제품</div><div class="card-value">${snkrs.length}</div></div>
    <div class="card"><div class="card-label">비고 있음</div><div class="card-value">${issues.length}</div></div>
  `;

  document.getElementById('issue-count').textContent = (kc.length + mismatch.length + snkrs.length) + '건';

  const issueRows = [...kc, ...mismatch, ...snkrs].filter((r, i, a) => a.findIndex(x => x.id === r.id) === i);

  if (!issueRows.length) {
    document.getElementById('issue-table-wrap').innerHTML = '<div class="empty">이슈 제품이 없습니다 ✅</div>';
    return;
  }

  document.getElementById('issue-table-wrap').innerHTML = `
    <div style="overflow-x:auto;">
    <table>
      <thead><tr>
        <th>검수일시</th><th>사용자</th><th>모드</th><th>스타일번호</th><th>제품명</th>
        <th>KC인증</th><th>상태</th><th>비고</th>
      </tr></thead>
      <tbody>
        ${issueRows.slice(0, 100).map(r => `<tr>
          <td>${fmtDate(r.created_at)}</td>
          <td>${r.user_name || ''}</td>
          <td>${modeChip(r.inspect_mode)}</td>
          <td style="font-family:monospace;font-weight:700;">${r.input_style_num || ''}</td>
          <td>${r.product_name || ''}</td>
          <td style="text-align:center;">${kcChip(r.kc_certification)}</td>
          <td>${statusChip(r.status)}</td>
          <td style="color:#E67E22;font-size:11px;">${r.notes || ''}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>
  `;
}

// ── ③ 최근 검수 내역 ─────────────────────────────────────────
function renderInspectTable() {
  const keyword = (document.getElementById('search-input')?.value || '').trim().toUpperCase();
  let rows = applyFilters(allInspections);
  if (keyword) {
    rows = rows.filter(r =>
      (r.input_style_num || '').toUpperCase().includes(keyword) ||
      (r.product_name || '').includes(keyword)
    );
  }

  document.getElementById('inspect-count').textContent = rows.length + '건';

  if (!rows.length) {
    document.getElementById('inspect-table-wrap').innerHTML = '<div class="empty">데이터가 없습니다</div>';
    return;
  }

  document.getElementById('inspect-table-wrap').innerHTML = `
    <div style="overflow-x:auto;">
    <table>
      <thead><tr>
        <th>검수일시</th><th>사용자</th><th>모드</th><th>스타일번호</th><th>제품명</th>
        <th>카테고리</th><th>뱃징</th><th>판매가격</th><th>할인율</th>
        <th>KC인증</th><th>쿠폰불가</th><th>제조국</th><th>상태</th>
      </tr></thead>
      <tbody>
        ${rows.slice(0, 200).map(r => `<tr>
          <td>${fmtDate(r.created_at)}</td>
          <td>${r.user_name || ''}</td>
          <td>${modeChip(r.inspect_mode)}</td>
          <td style="font-family:monospace;font-weight:700;">${r.input_style_num || ''}</td>
          <td>${r.product_name || ''}</td>
          <td>${r.category || ''}</td>
          <td>${badgeChip(r.badge)}</td>
          <td style="text-align:right;">${r.sale_price ? r.sale_price + ' 원' : '-'}</td>
          <td style="text-align:center;">${r.discount_rate || '-'}</td>
          <td style="text-align:center;">${kcChip(r.kc_certification)}</td>
          <td style="text-align:center;">${r.coupon_unavailable || '-'}</td>
          <td>${r.manufacture_country || ''}</td>
          <td>${statusChip(r.status)}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>
  `;
}

// ── ④ 사용자별 현황 ───────────────────────────────────────────
function renderUserStats() {
  const inspRows  = applyFilters(allInspections);
  const badgeRows = applyFilters(allBadge);

  function buildStats(rows) {
    const byUser = {};
    rows.forEach(r => { byUser[r.user_name] = (byUser[r.user_name] || 0) + 1; });
    const sorted = Object.entries(byUser).sort((a,b) => b[1]-a[1]);
    const max = sorted[0]?.[1] || 1;
    return { sorted, max };
  }

  function renderStat(el, rows) {
    const { sorted, max } = buildStats(rows);
    if (!sorted.length) { el.innerHTML = '<div class="empty">데이터 없음</div>'; return; }
    el.innerHTML = sorted.map(([name, cnt]) => `
      <div class="user-stat-row">
        <div class="user-avatar">${name.charAt(0)}</div>
        <div class="user-stat-name">${name}</div>
        <div class="user-stat-bar-wrap">
          <div class="user-stat-bar" style="width:${Math.round(cnt/max*100)}%"></div>
        </div>
        <div class="user-stat-num">${cnt}</div>
      </div>
    `).join('');
  }

  renderStat(document.getElementById('user-inspect-wrap'), inspRows);
  renderStat(document.getElementById('user-badge-wrap'), badgeRows);
}

// ── ⑤ 날짜별 차트 ────────────────────────────────────────────
function renderChart() {
  const rows = applyFilters(allInspections);
  const byDate = {};
  rows.forEach(r => {
    const d = r.created_at?.slice(0,10);
    if (d) byDate[d] = (byDate[d] || 0) + 1;
  });
  const dates = Object.keys(byDate).sort();
  if (!dates.length) {
    document.getElementById('chart-wrap').innerHTML = '<div class="empty">데이터 없음</div>';
    return;
  }
  const max = Math.max(...Object.values(byDate));
  document.getElementById('chart-wrap').innerHTML = `
    <div style="display:flex;align-items:flex-end;gap:6px;height:120px;padding-bottom:24px;position:relative;">
      ${dates.map(d => `
        <div style="display:flex;flex-direction:column;align-items:center;flex:1;gap:4px;height:100%;justify-content:flex-end;">
          <div style="font-size:10px;font-weight:700;color:var(--gray-500);">${byDate[d]}</div>
          <div style="width:100%;background:var(--nike-orange);border-radius:2px 2px 0 0;height:${Math.round(byDate[d]/max*80)}px;"></div>
          <div style="font-size:9px;color:var(--gray-500);white-space:nowrap;transform:rotate(-30deg);margin-top:4px;">${d.slice(5)}</div>
        </div>
      `).join('')}
    </div>
  `;
}

// ── 헬퍼 ─────────────────────────────────────────────────────
function modeChip(m) {
  if (!m || m === 'LIVE') return '<span class="badge badge-blue">LIVE</span>';
  if (m === 'STEALTH')    return '<span class="badge badge-gray">STEALTH</span>';
  if (m === '뱃징')       return '<span class="badge badge-orange">뱃징</span>';
  return `<span class="badge badge-gray">${m}</span>`;
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  // KST = UTC+9
  const kst = new Date(d.getTime() + 9 * 60 * 60 * 1000);
  return (kst.getUTCMonth()+1) + '/' + kst.getUTCDate() + ' ' +
    String(kst.getUTCHours()).padStart(2,'0') + ':' + String(kst.getUTCMinutes()).padStart(2,'0');
}

function badgeChip(b) {
  if (!b || b === 'x') return '<span class="badge badge-gray">-</span>';
  if (b === '신제품') return `<span class="badge badge-green">${b}</span>`;
  if (b === '베스트셀러') return `<span class="badge badge-orange">${b}</span>`;
  if (b === '품절') return `<span class="badge badge-red">${b}</span>`;
  return `<span class="badge badge-blue">${b}</span>`;
}

function kcChip(kc) {
  if (kc === 'O') return '<span class="badge badge-green">O</span>';
  if (kc === '△') return '<span class="badge badge-amber">△</span>';
  return '<span class="badge badge-gray">-</span>';
}

function statusChip(s) {
  if (!s) return '';
  if (s === 'done' || s === '완료') return '<span class="badge badge-green">완료</span>';
  if (s === 'snkrs' || s === 'SNKRS') return '<span class="badge badge-purple">SNKRS</span>';
  if (s === 'timeout' || s === '타임아웃') return '<span class="badge badge-red">타임아웃</span>';
  if (s === 'mismatch' || s === '검색불일치') return '<span class="badge badge-amber">불일치</span>';
  if (s === 'done_tracking') return '<span class="badge badge-blue">트레킹완료</span>';
  if (s === 'not_found_tracking') return '<span class="badge badge-amber">미발견</span>';
  return `<span class="badge badge-gray">${s}</span>`;
}

// ── 초기 로드 ─────────────────────────────────────────────────
if (sessionStorage.getItem('auth') === '1') loadAll();
